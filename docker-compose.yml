version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/letsfin
      - JWT_SECRET=${JWT_SECRET:-secret}
      - PYTHON_API_URL=http://backend:8000
    depends_on:
      - mongo
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FAISS_INDEX_PATH=/app/indexes/sample
    volumes:
      - ./backend/indexes:/app/indexes

volumes:
  mongo-data:
